name: next

# CI for the Satin engine workspace in next/. The root workspace is not built here.
# This repository is checked out at mega-evm/ and the evm2 fork at evm2/, so
# next/'s path dependency ../../evm2 resolves. The fork revision is read from
# next/evm2-fork.env and from nowhere else.
#
# check     — every pull request and push that touches next/** or this file.
#             The commands are next/diff/scripts/ci-local.sh (with the check that
#             regen-reference.sh refuses an output in the corpus, the sample gate,
#             its negative controls and the gate fault injection).
# reference — daily, and pulls or pushes that touch next/reference/**,
#             next/diff/data/**, or next/diff/shared/**.
#             Runs next/diff/scripts/check-reference.sh sample.
# full      — daily and workflow_dispatch. Downloads MEGA_EVM2_CORPUS_URL
#             (repository variable, else secret of the same name) and runs
#             gate.sh full, then controls.sh full. Succeeds with a notice when
#             the URL is unset.

on:
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  push:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  schedule:
    # Daily. reference always runs; full skips the gate when the corpus URL is unset.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull requests are cancelled. Pushes, the daily run, and manual runs are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Read the evm2 fork pin
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source next/evm2-fork.env
          set +a
          if [ -z "${EVM2_FORK_REPO:-}" ] || [ -z "${EVM2_FORK_REV:-}" ]; then
            echo "next/evm2-fork.env must set EVM2_FORK_REPO and EVM2_FORK_REV" >&2
            exit 1
          fi
          if ! printf '%s\n' "$EVM2_FORK_REPO" | grep -Eq '^[^/[:space:]]+/[^/[:space:]]+$'; then
            echo "EVM2_FORK_REPO must be owner/name" >&2
            exit 1
          fi
          if ! printf '%s\n' "$EVM2_FORK_REV" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "EVM2_FORK_REV must be a 40-character commit sha" >&2
            exit 1
          fi
          printf 'EVM2_FORK_REPO=%s\n' "$EVM2_FORK_REPO" >> "$GITHUB_ENV"
          printf 'EVM2_FORK_REV=%s\n' "$EVM2_FORK_REV" >> "$GITHUB_ENV"

      # The fork's default branch is checked out first; the pinned commit is then fetched by hash, so
      # a pin that was never pushed fails with its own message instead of a checkout error.
      - name: Checkout evm2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.EVM2_FORK_REPO }}
          path: evm2
          persist-credentials: false

      - name: Check that the evm2 fork pin is pushed
        working-directory: evm2
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 "https://github.com/${EVM2_FORK_REPO}.git" "$EVM2_FORK_REV" \
            || ! git cat-file -e "${EVM2_FORK_REV}^{commit}" \
            || ! git checkout --detach --quiet "$EVM2_FORK_REV"; then
            echo "fork pin not pushed: commit ${EVM2_FORK_REV} is not in ${EVM2_FORK_REPO}. Push it there or update next/evm2-fork.env." >&2
            exit 1
          fi

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Reads mega-evm/next/rust-toolchain.toml (channel and components).
          rust-src-dir: mega-evm/next
          target: riscv64imac-unknown-none-elf
          # Clippy denies warnings itself. Do not put -D warnings on every rustc.
          rustflags: ""
          cache: true
          cache-shared-key: next

      - name: Install zstd
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi

      - name: Fmt, clippy, test, no_std, the sample gate, its controls and faults
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
        run: bash next/diff/scripts/ci-local.sh

  reference:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Pull request touches the reference inputs
        id: pr
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The repository is public: the base is fetched over https without the token.
          if ! git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD -- next/reference next/diff/data next/diff/shared | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push touches the reference inputs
        id: push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$BEFORE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD -- next/reference next/diff/data next/diff/shared | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip the reference check
        if: github.event_name != 'schedule' && steps.pr.outputs.run != 'true' && steps.push.outputs.run != 'true'
        run: |
          echo "NOTICE: this diff does not touch next/reference, next/diff/data, or next/diff/shared. Skipping the reference check."

      - name: Install the next/ toolchain
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: true
          # The script builds next/reference into next/target/mega-evm2-reference.
          cache-workspaces: "mega-evm/next/reference -> ../target/mega-evm2-reference"
          cache-shared-key: next-reference

      - name: Install zstd
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi

      - name: Regenerate the sample reference outputs
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        run: bash next/diff/scripts/check-reference.sh sample

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Read the evm2 fork pin
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source next/evm2-fork.env
          set +a
          if [ -z "${EVM2_FORK_REPO:-}" ] || [ -z "${EVM2_FORK_REV:-}" ]; then
            echo "next/evm2-fork.env must set EVM2_FORK_REPO and EVM2_FORK_REV" >&2
            exit 1
          fi
          if ! printf '%s\n' "$EVM2_FORK_REPO" | grep -Eq '^[^/[:space:]]+/[^/[:space:]]+$'; then
            echo "EVM2_FORK_REPO must be owner/name" >&2
            exit 1
          fi
          if ! printf '%s\n' "$EVM2_FORK_REV" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "EVM2_FORK_REV must be a 40-character commit sha" >&2
            exit 1
          fi
          printf 'EVM2_FORK_REPO=%s\n' "$EVM2_FORK_REPO" >> "$GITHUB_ENV"
          printf 'EVM2_FORK_REV=%s\n' "$EVM2_FORK_REV" >> "$GITHUB_ENV"

      # The fork's default branch is checked out first; the pinned commit is then fetched by hash, so
      # a pin that was never pushed fails with its own message instead of a checkout error.
      - name: Checkout evm2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.EVM2_FORK_REPO }}
          path: evm2
          persist-credentials: false

      - name: Check that the evm2 fork pin is pushed
        working-directory: evm2
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 "https://github.com/${EVM2_FORK_REPO}.git" "$EVM2_FORK_REV" \
            || ! git cat-file -e "${EVM2_FORK_REV}^{commit}" \
            || ! git checkout --detach --quiet "$EVM2_FORK_REV"; then
            echo "fork pin not pushed: commit ${EVM2_FORK_REV} is not in ${EVM2_FORK_REPO}. Push it there or update next/evm2-fork.env." >&2
            exit 1
          fi

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          target: riscv64imac-unknown-none-elf
          rustflags: ""
          cache: true
          cache-shared-key: next

      - name: Install zstd
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi

      - name: Run the full corpus gate and its negative controls
        env:
          CORPUS_URL_VAR: ${{ vars.MEGA_EVM2_CORPUS_URL }}
          CORPUS_URL_SECRET: ${{ secrets.MEGA_EVM2_CORPUS_URL }}
        run: |
          set -euo pipefail
          url="${CORPUS_URL_VAR:-}"
          if [ -z "$url" ]; then
            url="${CORPUS_URL_SECRET:-}"
          fi
          if [ -z "$url" ]; then
            echo "NOTICE: MEGA_EVM2_CORPUS_URL is not set as a repository variable or secret. Skipping the full corpus gate."
            exit 0
          fi
          work=$(mktemp -d)
          archive="$work/corpus"
          if ! curl -fsSL --retry 5 --retry-all-errors -o "$archive" "$url" 2>"$work/curl.err"; then
            echo "download of MEGA_EVM2_CORPUS_URL failed" >&2
            exit 1
          fi
          extract="$work/extract"
          mkdir -p "$extract"
          magic=$(od -An -N6 -tx1 "$archive" | tr -d ' \n')
          case "$magic" in
            28b52ffd*) tar --zstd -xf "$archive" -C "$extract" ;;
            1f8b*) tar -xzf "$archive" -C "$extract" ;;
            fd377a585a00*) tar -xJf "$archive" -C "$extract" ;;
            425a68*) tar -xjf "$archive" -C "$extract" ;;
            504b0304* | 504b0506* | 504b0708*) unzip -q "$archive" -d "$extract" ;;
            *) tar -xf "$archive" -C "$extract" ;;
          esac
          corpus=""
          while IFS= read -r dir; do
            root=$(dirname "$dir")
            if [ -f "$root/reference/reference-outputs.tar.zst" ] || [ -f "$root/reference/q11-oracles.tar.zst" ]; then
              corpus=$root
              break
            fi
          done < <(find "$extract" -type d -name real-blocks | sort)
          if [ -z "$corpus" ]; then
            echo "the corpus archive has no real-blocks/ next to reference/reference-outputs.tar.zst or reference/q11-oracles.tar.zst" >&2
            find "$extract" -maxdepth 3 -print >&2
            exit 1
          fi
          echo "Running gate.sh full on the downloaded corpus."
          MEGA_EVM2_CORPUS_DIR=$corpus bash next/diff/scripts/gate.sh full
          echo "Running controls.sh full on the downloaded corpus."
          MEGA_EVM2_CORPUS_DIR=$corpus bash next/diff/scripts/controls.sh full
