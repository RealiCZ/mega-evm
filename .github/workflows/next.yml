name: next

# CI for the Satin engine workspace in next/. The root workspace is not built here.
# This repository is checked out at mega-evm/ and the evm2 fork at evm2/, so
# next/'s path dependency ../../evm2 resolves. The fork revision is read from
# next/evm2-fork.env and from nowhere else.
#
# check     — every pull request and push that touches next/** or this file.
#             The commands are next/diff/scripts/ci-local.sh (with the check that
#             regen-reference.sh refuses an output directory or archive path in
#             the corpus, the sample gate, its negative controls and the gate
#             fault injection).
# reference — daily, and pulls or pushes that touch what the reference check
#             reads: next/reference/**, next/diff/data/**, next/diff/shared/**,
#             next/diff/scripts/**, next/scripts/**, next/rust-toolchain.toml, or
#             this file.
#             Runs next/diff/scripts/check-reference.sh sample. It installs Foundry:
#             the reference's mega-evm dependency builds its system contracts with
#             forge. No other job builds next/reference.
# full      — pushes to cz/feat/satin-evm2, daily and workflow_dispatch.
#             Downloads MEGA_EVM2_CORPUS_URL
#             (repository variable, else secret of the same name) and runs
#             gate.sh full, then controls.sh full. A missing URL fails integration
#             pushes; daily and manual runs succeed with a notice when it is unset.
# mega-eest — every pull request and push that touches next/** or this file.
#             Runs the reviewed Mega EEST slice and its wrong-expectation control
#             on adapter (b), built from this checkout and the pinned evm2 fork.
#             The suite revision is pinned in next/mega-eest.env.
# coverage  — every pull request and push that touches next/** or this file, and daily.
#             Runs next/scripts/coverage.sh (branch coverage of the engine crates under
#             the unit tests and the sample gate) and uploads lcov.info to Codecov with
#             the flag `next`. The upload never fails the job (a fork has no token).
# mutants   — pull requests: cargo-mutants on the engine lines the pull request changes; a
#             surviving or timed-out mutant that diff/mutants/suppressions.toml does not
#             list fails the job, as does a run that is not complete: one that reaches its
#             deadline (it ends itself before the job limit, with its report) before every
#             mutant it listed has an outcome.
#             Pushes to cz/feat/satin-evm2: the engine lines changed since the previous
#             push, within the same deadline; report only.
# mutants-audit — a fresh run of the full engine in eight shards: mutants-audit-plan
#             decides, mutants-audit (k/8) runs shard k, mutants-audit-merge merges them.
#             It runs on a push to cz/feat/satin-evm2 when a pushed commit's message carries
#             [mutants-audit], when the push changes the oracle or its inputs (next/Cargo.lock,
#             next/evm2-fork.env, next/diff/**, the engine's tests, next/.cargo/mutants.toml,
#             next/rust-toolchain.toml), or when no audit has completed on the branch in the
#             current ISO week (UTC); and on workflow_dispatch. Other pushes run the push diff
#             only. The merge lists the full set and every shard's slice itself, takes a
#             shard's results only when they are of this commit and exactly its slice, and
#             reports the audit complete or partial, with the mutants of a missing shard
#             counted. Report only. A complete audit leaves the artifact
#             next-mutants-audit-complete-<week>, which the plan looks for. The audit has a
#             concurrency group of its own, so no other job waits for it.
#             The oracle of every mutants job is the unit tests plus the sample gate
#             (next/scripts/mutants.sh), built with the `mutants` cargo profile and linked
#             with mold.

on:
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  push:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  schedule:
    # Daily. reference always runs; full skips the gate when the corpus URL is unset.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull requests are cancelled. Every other run has a group of its own and is left
  # to finish, so no push waits behind an earlier run; the mutation audit has its own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Reads mega-evm/next/rust-toolchain.toml (channel and components).
          rust-src-dir: mega-evm/next
          target: riscv64imac-unknown-none-elf
          # Clippy denies warnings itself. Do not put -D warnings on every rustc.
          rustflags: ""
          cache: true
          cache-shared-key: next

      - name: Install zstd
        run: bash next/scripts/install-zstd.sh

      - name: Fmt, clippy, test, no_std, the sample gate, its controls and faults
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
        run: bash next/diff/scripts/ci-local.sh

  reference:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Pull request touches the reference inputs
        id: pr
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The repository is public: the base is fetched over https without the token.
          if ! git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD -- 'next/reference/**' 'next/diff/data/**' 'next/diff/shared/**' \
            'next/diff/scripts/**' 'next/scripts/**' next/rust-toolchain.toml .github/workflows/next.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push touches the reference inputs
        id: push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$BEFORE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD -- 'next/reference/**' 'next/diff/data/**' 'next/diff/shared/**' \
            'next/diff/scripts/**' 'next/scripts/**' next/rust-toolchain.toml .github/workflows/next.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip the reference check
        if: github.event_name != 'schedule' && steps.pr.outputs.run != 'true' && steps.push.outputs.run != 'true'
        run: |
          echo "NOTICE: this diff does not touch next/reference, next/diff/data, next/diff/shared, next/diff/scripts, next/scripts, next/rust-toolchain.toml, or this workflow. Skipping the reference check."

      - name: Install the next/ toolchain
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: true
          # The script builds next/reference into next/target/mega-evm2-reference.
          cache-workspaces: "mega-evm/next/reference -> ../target/mega-evm2-reference"
          cache-shared-key: next-reference

      - name: Install zstd
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        run: bash next/scripts/install-zstd.sh

      # The reference depends on mega-evm, whose crates/system-contracts build script compiles the
      # system contracts with forge and fails without it.
      - name: Install Foundry
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

      - name: Regenerate the sample reference outputs
        if: github.event_name == 'schedule' || steps.pr.outputs.run == 'true' || steps.push.outputs.run == 'true'
        run: bash next/diff/scripts/check-reference.sh sample

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/cz/feat/satin-evm2')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          target: riscv64imac-unknown-none-elf
          rustflags: ""
          cache: true
          cache-shared-key: next

      - name: Install zstd
        run: bash next/scripts/install-zstd.sh

      - name: Run the full corpus gate and its negative controls
        env:
          CORPUS_URL_VAR: ${{ vars.MEGA_EVM2_CORPUS_URL }}
          CORPUS_URL_SECRET: ${{ secrets.MEGA_EVM2_CORPUS_URL }}
        run: |
          set -euo pipefail
          url="${CORPUS_URL_VAR:-}"
          if [ -z "$url" ]; then
            url="${CORPUS_URL_SECRET:-}"
          fi
          if [ -z "$url" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/cz/feat/satin-evm2" ]; then
              echo "::error::MEGA_EVM2_CORPUS_URL must be set as a repository variable or secret for integration pushes."
              exit 1
            fi
            echo "NOTICE: MEGA_EVM2_CORPUS_URL is not set as a repository variable or secret. Skipping the full corpus gate."
            exit 0
          fi
          work=$(mktemp -d)
          archive="$work/corpus"
          if ! curl -fsSL --retry 5 --retry-all-errors -o "$archive" "$url" 2>"$work/curl.err"; then
            echo "download of MEGA_EVM2_CORPUS_URL failed" >&2
            exit 1
          fi
          extract="$work/extract"
          mkdir -p "$extract"
          magic=$(od -An -N6 -tx1 "$archive" | tr -d ' \n')
          case "$magic" in
            28b52ffd*) tar --zstd -xf "$archive" -C "$extract" ;;
            1f8b*) tar -xzf "$archive" -C "$extract" ;;
            fd377a585a00*) tar -xJf "$archive" -C "$extract" ;;
            425a68*) tar -xjf "$archive" -C "$extract" ;;
            504b0304* | 504b0506* | 504b0708*) unzip -q "$archive" -d "$extract" ;;
            *) tar -xf "$archive" -C "$extract" ;;
          esac
          corpus=""
          while IFS= read -r dir; do
            root=$(dirname "$dir")
            if [ -f "$root/reference/reference-outputs.tar.zst" ] || [ -f "$root/reference/q11-oracles.tar.zst" ]; then
              corpus=$root
              break
            fi
          done < <(find "$extract" -type d -name real-blocks | sort)
          if [ -z "$corpus" ]; then
            echo "the corpus archive has no real-blocks/ next to reference/reference-outputs.tar.zst or reference/q11-oracles.tar.zst" >&2
            find "$extract" -maxdepth 3 -print >&2
            exit 1
          fi
          echo "Running gate.sh full on the downloaded corpus."
          MEGA_EVM2_CORPUS_DIR=$corpus bash next/diff/scripts/gate.sh full
          echo "Running controls.sh full on the downloaded corpus."
          MEGA_EVM2_CORPUS_DIR=$corpus bash next/diff/scripts/controls.sh full

  mega-eest:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: true
          cache-shared-key: next-mega-eest

      - name: Run the Mega EEST slice and its negative control
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
        run: bash next/scripts/mega-eest-gate.sh

  coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          components: llvm-tools-preview
          rustflags: ""
          cache: true
          cache-shared-key: next-coverage

      - name: Install zstd
        run: bash next/scripts/install-zstd.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage reports
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
          COV_DIR: ${{ github.workspace }}/mega-evm/next/target/coverage/next
        run: bash next/scripts/coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-coverage
          path: mega-evm/next/target/coverage/next
          if-no-files-found: error

      - name: Upload coverage to Codecov
        # The token is a repository secret: a pull request from a fork has none, and then
        # the report stays in the artifact above.
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
          files: mega-evm/next/target/coverage/next/lcov.info
          flags: next
          name: next
          verbose: true

  mutants:
    name: mutants (${{ github.event_name == 'pull_request' && 'pr' || 'push' }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/cz/feat/satin-evm2')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        working-directory: mega-evm
    env:
      # Every mutant relinks every test binary of the engine and the diff harness.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - name: Record the job's start
        working-directory: .
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: true
          cache-shared-key: next-mutants

      - name: Install mold
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false

      - name: Install zstd
        run: bash next/scripts/install-zstd.sh

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          # Pinned: a new release can change the set of generated mutants.
          tool: cargo-mutants@27.1.0

      - name: Test the mutation tooling
        run: |
          python3 -I scripts/test_mutation_gate.py
          python3 -I next/scripts/test_mutants_results.py

      - name: Run mutation testing
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
          OUT: ${{ github.workspace }}/mega-evm/next/target/mutants-out
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # End before the job limit (330 minutes), leaving 20 for the steps after this one. A
          # pull request run stopped there fails the gate as incomplete, with its report.
          export MUTANTS_BUDGET=$((JOB_START + (330 - 20) * 60 - $(date +%s)))
          # The repository is public: commits are fetched over https without the token.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE_SHA"
            bash next/scripts/mutants.sh pr "$BASE_SHA"
          else
            # After a force push the previous push is no branch's history; fetch it while the
            # repository still has it, so the diff starts from the merge base. mutants.sh states
            # the base it uses, and falls back to HEAD's parent without one.
            if [ -n "${BEFORE//0/}" ]; then
              git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$BEFORE" || true
            fi
            bash next/scripts/mutants.sh push "$BEFORE"
          fi

      - name: Show the linker of the test binaries
        if: always()
        run: |
          bin=$(find next/target/*/deps -maxdepth 1 -type f -perm -u+x -name 'mega_evm2-*' 2>/dev/null | head -1)
          if [ -n "$bin" ]; then readelf -p .comment "$bin" | grep -iE 'mold|lld|GNU ld' || true; fi

      - name: Score and gate
        # Fail closed: the scorer refuses a results directory that exists without
        # caught.txt and missed.txt or a status, and an unsuppressed survivor or timeout fails;
        # with --require-complete, so does a run that is not complete (or has no results).
        # Push runs report only.
        run: |
          rc=0
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 -I scripts/mutation_gate.py report \
              --results next/target/mutants-out/mutants.out \
              --suppressions next/diff/mutants/suppressions.toml \
              --require-complete \
              --summary "$GITHUB_STEP_SUMMARY" || rc=$?
            exit "$rc"
          fi
          python3 -I scripts/mutation_gate.py report \
            --results next/target/mutants-out/mutants.out \
            --suppressions next/diff/mutants/suppressions.toml \
            --scope "Push diff" \
            --summary "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::mutation survivors or an incomplete run (status $rc); see the report and the artifact"
          fi

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-mutants-${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          path: |
            mega-evm/next/target/mutants-out/mutants.out
            mega-evm/next/target/mutants-out.diff
          if-no-files-found: ignore
          overwrite: true

  mutants-audit-plan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/cz/feat/satin-evm2')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To list this repository's artifacts: has an audit completed this week?
      actions: read
    outputs:
      audit: ${{ steps.plan.outputs.audit }}
      shards: ${{ steps.plan.outputs.shards }}
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Decide whether this run audits the full engine
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          MARKER: ${{ contains(join(github.event.commits.*.message, ' '), '[mutants-audit]') }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'shards=["0/8","1/8","2/8","3/8","4/8","5/8","6/8","7/8"]' >> "$GITHUB_OUTPUT"
          why=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then why+=("a manual run"); fi
          if [ "$MARKER" = true ]; then why+=("a pushed commit's message carries [mutants-audit]"); fi
          # The oracle and its inputs: the dependencies and the fork, the diff harness with its
          # gates, data and suppressions, the engine's tests, the cargo-mutants configuration and
          # the toolchain. (Unit tests inside an engine source file are engine code here; a
          # change that weakens them asks for an audit with the marker.)
          inputs=(next/Cargo.lock next/evm2-fork.env next/diff next/mega-evm2/tests next/op-evm2/tests
            next/op-evm2/src/tests.rs next/op-evm2/src/test_vectors.rs next/.cargo/mutants.toml
            next/rust-toolchain.toml)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The repository is public: the previous push is fetched over https without the token.
            if [ -z "${BEFORE//0/}" ]; then
              why+=("there is no previous push to compare the oracle's inputs with")
            elif ! git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$BEFORE"; then
              why+=("the previous push $BEFORE could not be fetched to compare the oracle's inputs with")
            elif ! changed=$(git diff --name-only FETCH_HEAD HEAD -- "${inputs[@]}"); then
              why+=("the oracle's inputs could not be compared with the previous push")
            elif [ -n "$changed" ]; then
              why+=("the oracle's inputs changed since the previous push: $(head -5 <<< "$changed" | paste -sd ' ' -)")
            fi
          fi
          # A completed audit leaves the artifact next-mutants-audit-complete-<ISO week, UTC> in
          # its run. An artifact is made only by a merge that found the audit complete, cannot
          # be changed, outlives the week, and names the branch of its run, so listing the
          # artifacts of that name tells whether an audit completed on this branch this week.
          # When the listing fails, this counts as no audit: the fallback is one audit too many,
          # never one too few.
          week=$(date -u +%G-W%V)
          if ! n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=next-mutants-audit-complete-$week&per_page=100" |
            jq --arg branch "$BRANCH" '[.artifacts[] | select(.workflow_run.head_branch == $branch and (.expired | not))] | length'); then
            why+=("the artifacts of this week's completed audits could not be listed")
          elif [ "$n" = 0 ]; then
            why+=("no audit has completed on $BRANCH in $week")
          else
            echo "An audit completed on $BRANCH in $week."
          fi
          if [ ${#why[@]} -gt 0 ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            printf 'Full mutation audit: %s.\n' "${why[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "audit=false" >> "$GITHUB_OUTPUT"
            echo "No full mutation audit: no pushed commit carries [mutants-audit], the oracle's inputs are unchanged, and an audit completed on $BRANCH in $week. The push diff runs as always." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  mutants-audit:
    name: mutants-audit (${{ matrix.shard }})
    needs: mutants-audit-plan
    if: needs.mutants-audit-plan.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # The audit's own group, one per shard, so check, mega-eest and the gates never wait for an
    # audit. A newer audit's shard waits for the running one (and replaces an older one still
    # waiting): an audit that has started always finishes.
    concurrency:
      group: ${{ github.workflow }}-mutants-audit-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-audit-plan.outputs.shards) }}
    defaults:
      run:
        working-directory: mega-evm
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - name: Record the job's start
        working-directory: .
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: true
          cache-shared-key: next-mutants

      - name: Install mold
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false

      - name: Install zstd
        run: bash next/scripts/install-zstd.sh

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run the shard
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mega-evm/next/target
          OUT: ${{ github.workspace }}/mega-evm/next/target/mutants-out
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # End before the job limit (330 minutes), leaving 20 for the steps after this one.
          export MUTANTS_BUDGET=$((JOB_START + (330 - 20) * 60 - $(date +%s)))
          bash next/scripts/mutants.sh shard "$SHARD"

      - name: Show the linker of the test binaries
        if: always()
        run: |
          bin=$(find next/target/*/deps -maxdepth 1 -type f -perm -u+x -name 'mega_evm2-*' 2>/dev/null | head -1)
          if [ -n "$bin" ]; then readelf -p .comment "$bin" | grep -iE 'mold|lld|GNU ld' || true; fi

      - name: Upload the shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-mutants-shard-${{ strategy.job-index }}
          path: mega-evm/next/target/mutants-out/mutants.out
          if-no-files-found: ignore
          overwrite: true

  mutants-audit-merge:
    needs: [mutants-audit-plan, mutants-audit]
    # Also after a failed, cancelled or lost shard: its mutants count as missing.
    if: always() && needs.mutants-audit-plan.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mega-evm
    steps:
      - name: Checkout mega-evm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mega-evm
          persist-credentials: false

      - name: Check out the evm2 fork at its pin
        run: bash next/scripts/fetch-evm2-fork.sh

      - name: Install the next/ toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rust-src-dir: mega-evm/next
          rustflags: ""
          cache: false

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: List the full set and each shard's slice
        run: |
          set -euo pipefail
          # Listed here, independently of the shards: what the audit sets out to test, and the
          # slice each shard must have tested.
          mkdir -p "$RUNNER_TEMP/audit/slices"
          bash next/scripts/mutants.sh list full > "$RUNNER_TEMP/audit/inventory.txt"
          for k in 0 1 2 3 4 5 6 7; do
            bash next/scripts/mutants.sh list shard "$k/8" > "$RUNNER_TEMP/audit/slices/$k.txt"
          done
          echo "The full set has $(wc -l < "$RUNNER_TEMP/audit/inventory.txt") mutants."

      - name: Download the shards' results
        # A shard that uploaded nothing is missing from the merge, which counts its mutants.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: next-mutants-shard-*
          path: shards

      - name: Merge the shards
        id: merge
        run: |
          set -euo pipefail
          shards=()
          for k in 0 1 2 3 4 5 6 7; do shards+=(--shard "$k=$GITHUB_WORKSPACE/shards/next-mutants-shard-$k"); done
          python3 -I next/scripts/mutants-results.py merge --into next/target/mutants-out/mutants.out \
            --inventory "$RUNNER_TEMP/audit/inventory.txt" --slices "$RUNNER_TEMP/audit/slices" \
            --shards 8 --commit "$GITHUB_SHA" --tool "$(cd next && cargo mutants --version)" \
            --summary "$GITHUB_STEP_SUMMARY" "${shards[@]}" | tee "$RUNNER_TEMP/audit/merge.log"
          status=$(sed -n 's/^MUTANTS-STATUS status=\([a-z-]*\) .*/\1/p' "$RUNNER_TEMP/audit/merge.log")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          if [ "$status" != complete ]; then
            echo "::warning::the full audit is $status; see the report and the shards' table"
          fi

      - name: Report the full engine
        run: |
          rc=0
          python3 -I scripts/mutation_gate.py report \
            --results next/target/mutants-out/mutants.out \
            --suppressions next/diff/mutants/suppressions.toml \
            --scope "Full-engine audit" \
            --summary "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::mutation survivors, timeouts or mutants without an outcome (status $rc); see the report and the artifact"
          fi

      - name: Upload the merged results
        uses: actions/upload-artifact@v4
        with:
          name: next-mutants-audit
          path: mega-evm/next/target/mutants-out/mutants.out
          overwrite: true

      - name: Record this week's completed audit
        # Read by mutants-audit-plan: an audit completed on this branch this week.
        if: steps.merge.outputs.status == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: next-mutants-audit-complete-${{ steps.merge.outputs.week }}
          path: mega-evm/next/target/mutants-out/mutants.out/status.json
          retention-days: 14
          overwrite: true
