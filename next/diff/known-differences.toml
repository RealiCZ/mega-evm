# Differences between the reference (the Satin implementation under review) and the Satin engine
# on evm2 that the gates accept: `[[difference]]` for the synthetic gate (by scenario),
# `[[replay_difference]]` for the engine replay gate (by set, block and transaction index, checked
# against the transaction hash). A gate passes only if its differences are exactly these: an
# unlisted difference fails, and so does a listed entry that differs otherwise or no longer differs.
#
# A `frames` entry lists the inspector's frames on both sides as JSON, each frame cut to the keys
# the frame comparison reads (a halted frame: kind, level, gas_limit, reservoir, value, status).
# A `[[class]]` table enables a class of differences whose shape the gate checks in full; a case
# with an entry of its own is held to that entry and never to a class.

# revm labels a DUP whose operand is deeper than the stack as `StackOverflow`: its
# `dup` returns false for both underflow and overflow, and its DUP instructions (`DUP1` to `DUP16`
# and `DUPN`) map every false to overflow. evm2 tells them apart and reports `StackUnderflow`.
# Gas, output and state are equal. The owner accepted evm2's `StackUnderflow` label on 2026-11-05
# (the general rule for label-only differences), as a class: `p6_dupn` keeps its entry below, and
# the class `dup_stack_label` takes any other case whose only difference is this label
# (`gate::dup_stack_label`).
[[class]]
name = "dup_stack_label"
why = "A label difference only: revm reports StackOverflow for every failed DUP (DUP1 to DUP16 or DUPN deeper than the stack), evm2 StackUnderflow. Gas, output, state and read set are equal."
signoff = "owner sign-off 2026-11-05"

[[difference]]
scenario = "p6_dupn"
field = "halt"
reference = "StackOverflow"
candidate = "StackUnderflow"
signoff = "owner sign-off 2026-11-05"

