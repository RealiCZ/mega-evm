# Differences between the reference (the Satin implementation under review) and the Satin engine
# on evm2 that the synthetic gate accepts. The gate passes only if its differences are exactly
# these: an unlisted difference fails, and so does a listed entry that no longer differs.

# revm labels a DUP whose operand is deeper than the stack as `StackOverflow`: its
# `dup` returns false for both underflow and overflow, and `dupn_enabled` maps every false to
# overflow. evm2 tells them apart and reports `StackUnderflow`. Gas, output and state are equal.
#
# STATUS: the owner has NOT yet signed off on accepting evm2's label. This entry records an open
# question, not a decision; when it is resolved (fix the reference, or accept evm2's label), this
# entry is removed or confirmed.
[[difference]]
scenario = "p6_dupn"
field = "halt"
reference = "StackOverflow"
candidate = "StackUnderflow"
