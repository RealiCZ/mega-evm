# The owner's decisions of 2026-11-08 change both implementations; the engine has made each change
# and the reference (the other implementation) has not yet made two of them. Until it does, the
# gates accept exactly the difference each change makes, and nothing else: a case is of a class
# only when the engine, run again under the reference's rule, has no difference from the reference
# at all (`gate::scenario_verdict`). Each class goes once the reference makes the change.

# Every EIP-7702 list is simulated before it is applied, whatever its length, so every authority
# whose entry passes the chain-id, nonce and signature gates is loaded: a list that runs out of gas
# part-way leaves the engine's read set holding authorities the reference's never reached.
[[class]]
name = "auth_preflight_reads"
why = "SATIN-AUTH-005: every authority the authorization preflight consults is loaded, whatever the list's length. The other implementation still skips the simulation for a list too short to cross a limit and has not made this change yet; a list that runs out of gas before its first frame then reads more accounts on the engine's side. A case is of this class only when the engine, run again without that simulation, has no difference from the reference at all."
signoff = "owner decision 2026-11-08 (SATIN-AUTH-005)"

# ModExp charges its 500 minimum, then its formula price, then checks EIP-7823's bound (evm2
# upstream's order): an over-bound input is charged, and decided under gas detention, at its
# formula price, where the reference charges and prices it at 500.
[[class]]
name = "modexp_formula_price"
why = "SATIN-PCMP-007 and SATIN-DET-023: ModExp checks EIP-7823's bound after its whole formula price is charged, and an over-bound input is priced by its formula. The other implementation still checks the bound first and has not made this change yet; an over-bound input is then labelled PrecompileOOG against PrecompileError when its gas lies between the two prices, and a detained call whose two prices straddle its allowance or forward is decided the other way. A case is of this class only when the engine, run again with the bound checked first, has no difference from the reference at all."
signoff = "owner decision 2026-11-08 (SATIN-PCMP-007)"

# Every give-back of state and history gas credits a reservoir, never regular gas, and a fresh
# slot, a new account and a creation's account take a flat legacy share from regular gas first.
[[class]]
name = "reservoir_give_back"
why = "SATIN-HIST-012, SATIN-POOL-014 and SATIN-STATE-012: every give-back of state or history gas (a refill, the destruction table, a start's charge given back, a failed frame's rollback) credits a reservoir and never regular gas, and a fresh slot, a new account and a creation's account take a flat legacy share from regular gas first. The other implementation still credits a give-back to regular gas first, up to the state gas that gas paid, returns a failed frame's spill to its regular gas, and draws every state charge from the reservoir first, and has not made this change yet; what that moves (GAS, forwards, which charge runs out of gas, the split of the gas left between the pools, detention's compute, a keyless deployment's gasUsed) is the program's to decide. A case is of this class only when the engine, run again under EIP-8037's give-back rule without legacy shares, has no difference from the reference at all; a case that also meets another enabled class's change is that class's when the run under both rules has none."
signoff = "owner decision 2026-11-09 (SATIN-POOL-014)"

# The owner's later decisions of the same day that restore Rex6's rules for system contracts and
# blocks change both implementations; the engine has made each change and the reference has not
# yet. Each class is checked as the ones above: a case is of it only when the engine, run again
# under the reference's rule, has no difference from the reference at all, alone or, for a case
# that meets two or three of the decided changes, under all their rules. Each class goes once the
# reference makes the change.

# Deposits and system-originated transactions pay history gas; a failed deposit reports its body
# and calldata as history bytes.
[[class]]
name = "deposit_history"
why = "SATIN-HIST-016, SATIN-HIST-022 and SATIN-DEP-001: a deposit and a system-originated transaction (a Mega System Transaction among them) pay history gas as any transaction does, for their body and calldata in their validation, their start record, logs, records and deposited code, and a failed deposit reports no history gas but its body and calldata as history bytes; system calls stay exempt. The other implementation still prices no history for them and has not made this change yet; what that moves (a deposit's gas used, which deposit fails, its reservoir, a receipt's cumulative gas, the block's counters) is the transaction's to decide. A case, a recorded transaction or a recorded block is of this class only when the engine, run again with deposits and system-originated transactions exempt from history gas, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-HIST-016)"

# An Oracle read is made before its cold access, its warm base included, is charged.
[[class]]
name = "oracle_read_before_charge"
why = "SATIN-ORCL-004 and SATIN-DET-003: an Oracle SLOAD loads the slot, asks the service and marks the read, at the compute before its cold access, then charges the cold access, COLD_SLOAD_COST with its warm base, so a frame that cannot pay it, even one short of the warm base, still loads, asks and marks before it runs out of gas, the mark standing. The other implementation still charges the warm base first, as the opcode's static gas, runs out of gas before the load when the rest of the cold access cannot then be paid, and marks the read once both are paid; it has not made this change yet. A case is of this class only when the engine, run again with that order, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-ORCL-004)"

# A refused volatile read costs nothing.
[[class]]
name = "refusal_costs_nothing"
why = "SATIN-MAC-003, SATIN-MAC-004 and SATIN-MAC-007: in a frame whose volatile-data access is off, a refused read reverts on the gas the frame held when the opcode was reached, before its static gas and before its body charges or checks anything; an opcode volatile whatever its operands is refused before its operands, a BLOCKHASH on an empty stack included; a call target's EIP-7702 delegate is read for the check. The other implementation still charges the static gas first and refuses an account read where its body loads the beneficiary, after its earlier charges, and has not made this change yet. A case is of this class only when the engine, run again with that order, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-MAC-003)"

# A Mega System Transaction is held to the block's packing budgets.
[[class]]
name = "mst_packing_budgets"
why = "SATIN-BLK-003, SATIN-BLK-006, SATIN-BLK-007 and SATIN-MST-009: a Mega System Transaction is held to the block's data-size, KV-update and state-growth budgets and to building policy as any other non-deposit transaction is; deposits stay exempt. The other implementation still exempts it and has not made this change yet. A recorded block is of this class only when the engine, run again with the exemption, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-BLK-007)"

# Every block deploys the system contracts before its transactions.
[[class]]
name = "system_contract_deployment"
why = "SATIN-SYSC-003 and SATIN-REG-008: every block deploys the system contracts as steps of its pre-block sequence, on the state the earlier steps left: the Oracle, the High-Precision Timestamp, KeylessDeploy, MegaAccessControl and MegaLimitControl, each installed where its address holds no account and given its code where the account holds other code, nonce, balance and storage kept; then the SequencerRegistry, seeded when new and migrated in place from version 1.0.0. The other implementation still deploys none of them and has not made this change yet; a recorded block of an earlier spec, whose state holds an earlier Oracle or lacks a later contract, then leaves another post-state, and its transactions run on the code that block held. A recorded block is of this class only when the engine, run again without the deployments, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-SYSC-003)"

# The live system address is resolved once, and no transaction warms the registry for its
# classification.
[[class]]
name = "once_per_block_resolution"
why = "SATIN-REG-002: a block resolves its live system address once, after its other pre-block steps, as a read-only pre-block state, and a single transaction's EVM once, when it is made, by a direct read of the state; every transaction is classified against it, and no transaction reads the registry, or finds its account or slot 0 warm, for its classification. The other implementation still reads both for every transaction, warm for the rest of it, and has not made this change yet; a transaction that reads the registry, as every Mega System Transaction does through the Oracle's check of its caller, then pays their cold access here, and what that moves (its gas used, a receipt's cumulative gas, which later transaction the block's gas limit refuses) is the transaction's or the block's to decide. A case, a recorded transaction or a recorded block is of this class only when the engine, run again with that per-transaction read, has no difference from the reference at all."
signoff = "owner decision 2026-11-09 (SATIN-REG-002)"

