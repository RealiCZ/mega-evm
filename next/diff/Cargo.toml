[package]
name = "mega-evm2-diff"
description = "Shared scenarios and strict differential gates for the Satin engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobenches = false

[dependencies]
# megaeth
mega-evm2 = { path = "../mega-evm2", features = ["compare", "salt-test-hasher"] }
mega-evm2-scenarios = { path = "shared" }
op-evm2 = { workspace = true, features = ["std"] }

# evm2
evm2 = { workspace = true, features = ["std"] }

# alloy
alloy-consensus = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }

# misc
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "=5.0.1", default-features = false }

[[bench]]
name = "engine"
harness = false

[[bin]]
name = "bench-blocks"
path = "benches/blocks.rs"
