# Negative controls of the differential gates: one control per switch.
#
# Every fix the Satin engine makes on top of stock evm2 is behind a named switch: `off("<name>")`
# in `next/mega-evm2/src`, which reads `MEGA_EVM2_DISABLE=<name>,...` (a comma-separated list;
# feature `compare` only, otherwise a constant `false`). Each engine switch has a `[[control]]`
# table. A fix no gate case can show (a database that fails a read, the Oracle read in a pre-block
# system call) has no switch; an engine test in `next/mega-evm2/tests` proves it instead. The gate harness has switches of its own, `off("<name>")` in `next/diff`, for fixture
# choices that make the engine's inputs match the reference's (absent accounts, delegation code,
# reads of absent storage); each has a `[[harness]]` table with the same keys.
#
# A control names the one gate case that differs from the reference when its switch is off.
# `scripts/controls.sh` runs that case with the switch on (it must pass) and off (the gate must
# report a difference for the case), and fails when a switch in either source has no table here
# (`unlisted`), or a table's switch is not in its source (`stale`). The source scan is textual and
# finds `off("<name>")` with any whitespace or line breaks inside the parentheses and an optional
# trailing comma (names of a-z, 0-9 and _); a name built at run time is not found.
#
# Keys of a control:
#   switch    the name in `off("…")`
#   gate      main | fuzz | replay | block
#   scenario  (main) the scenario name
#   mode      (fuzz) the generator mode, 1..=14
#   seed      (fuzz) the seed
#   block     (replay, block) the recorded block, `<set>:<number>`
#   scope     sample: the case is in the in-repo sample (run by CI on every change);
#             full: only the full corpus has a case that catches the switch (run daily)
#   why       what the fix does, so a reader knows what the control proves; the case should
#             differ in what `why` names (a price or gas claim needs a case whose gas differs, not
#             only its reads)
#
# Adding a switch: find a case that differs with it off (run the gate tests directly with
# `MEGA_EVM2_DISABLE=<name>` and look for `DIFFER` lines or a non-zero `differ=`), prefer a case
# of the sample, and add its control here. `MEGA_EVM2_ONLY=<scenario>` (main),
# `MEGA_EVM2_FUZZ_MODE=<m> MEGA_EVM2_FUZZ=<s>..=<s>` (fuzz) and `MEGA_EVM2_BLOCKS=<set>:<n>`
# (replay, block) select a single case.

[[control]]
switch = "access_control"
gate = "main"
scenario = "a05_is_disabled"
scope = "sample"
why = "The engine answers MegaAccessControl calls itself and refuses volatile reads in frames at or below one that disabled access; off, the call runs the contract's bytecode and nothing is refused."

[[control]]
switch = "allowance"
gate = "main"
scenario = "p6_allowance_value_call"
scope = "sample"
why = "A value-carrying CALL or CALLCODE gives the child a history allowance next to the 2,300 stipend; off, the child's logs and writes are paid from its own gas."

[[control]]
switch = "auth_beneficiary"
gate = "main"
scenario = "e14_beneficiary_authority_detained"
scope = "sample"
why = "An applied EIP-7702 authority that is the block beneficiary detains the transaction from its start; off, it runs undetained."

[[control]]
switch = "auth_counts"
gate = "main"
scenario = "e18_delegate_halts"
scope = "sample"
why = "The authorities' write records and created accounts count on the transaction's data size, KV updates and state growth, and come out of the first frame's budgets; off, they are not counted."

[[control]]
switch = "auth_history"
gate = "main"
scenario = "e18_delegate_halts"
scope = "sample"
why = "The history gas of the authorization records is charged before the first frame, in one charge with the first frame's start record; off, it is not charged."

[[control]]
switch = "auth_history_report"
gate = "main"
scenario = "e18_delegate_halts"
scope = "sample"
why = "The authorities' history is reported in the transaction's history totals once nothing can take the list back; off, the charge is made but not reported."

[[control]]
switch = "auth_list_rule"
gate = "main"
scenario = "e10_list_skipped_kv"
scope = "sample"
why = "An authorization list with more entries than the KV or state-growth room left is simulated and skipped, as Satin's list rule does; off, the list is applied."

[[control]]
switch = "beneficiary"
gate = "main"
scenario = "q53_beneficiary_call_detains"
scope = "sample"
why = "Reading or calling the block beneficiary's account is a volatile read that caps the remaining compute gas (detention); off, it is not."

[[control]]
switch = "body_records"
gate = "main"
scenario = "e16_body_records_over_data_limit"
scope = "sample"
why = "The transaction body plus one write record per authorization entry is checked against the data-size limit before any gas check, and refuses the transaction; off, it runs."

[[control]]
switch = "built_check"
gate = "fuzz"
mode = 4
seed = 59
scope = "sample"
why = "A result for a message whose frame was never built (a precompile or interceptor answer, a refused start) is settled against its caller's detention entry; off, it pops the caller's entry as its own."

[[control]]
switch = "unbuilt_burn"
gate = "main"
scenario = "x5_default_caps_read_collision_sstore"
scope = "sample"
why = "A message that halts without a built frame (a precompile answer, a creation that collides after its start) burns its whole forward, which is not compute; off, the forward a collision burned stays in the transaction's compute, so a creation that collides after a volatile read leaves its caller over the detention limit and the caller reverts."

[[control]]
switch = "classify"
gate = "main"
scenario = "d1_top_frame_crosses"
scope = "sample"
why = "An out-of-gas whose failed charge the withheld gas could have paid is a detention crossing (limit exceeded, compute burned as Satin burns it), not a plain out-of-gas halt."

[[control]]
switch = "cold_account"
gate = "main"
scenario = "q47_det_balance_skip_cold_sees_total"
scope = "sample"
why = "An account load's skip-cold check (the account opcodes, the call family's target, SELFDESTRUCT's beneficiary) sees spendable plus withheld gas, through the fork's gas reserve (BudgetUse::ColdAccount); off, spendable gas only, so a cold load Satin makes is skipped and the frame halts instead of crossing."

[[control]]
switch = "create_lend"
gate = "main"
scenario = "q01_det_create_spill_salt2"
scope = "sample"
why = "A CREATE's state charge that spills past the reservoir draws the frame's withheld gas first, through the fork's gas reserve (ReserveDraw::StateSpill(CreateState), keyless deployment included); off, it is charged to the spendable gas only."

[[control]]
switch = "delegate_no_debit"
gate = "fuzz"
mode = 4
seed = 1101
scope = "sample"
why = "The guard on a CALL's EIP-7702 delegation charge and the delegate's skip-cold check see spendable plus withheld gas, through the fork's gas reserve (BudgetUse::DelegationGuard); off, spendable gas only, so the call halts without a debit where Satin loads the delegate and crosses."

[[control]]
switch = "deposit_caller"
gate = "main"
scenario = "edge_deposit_new_caller_value_new_recipient_runtime_oog"
scope = "sample"
why = "A deposit whose caller account does not exist yet counts the new account on state growth and charges its new-account state gas; off, the creation is free. The case is of the accepted class halted_first_frame (its first frame cannot pay its value's new account): on, the gate accepts it by the class's shape; off, its gas, state and status differ as well, which the class does not take."

[[control]]
switch = "deposit_loan_back"
gate = "main"
scenario = "q62_det_refused_deposit_alone"
scope = "sample"
why = "When a code deposit's data-size draw is refused, the withheld gas its state spill and its history drew (the deposit loan) goes back to the frame, since the refusal restores the frame's gas from before the deposit; off, it is lost (a creator's gas_left of 2,780,357 against the reference's 2,942,157)."

[[control]]
switch = "deposit_loan_reset"
gate = "main"
scenario = "q61_det_failed_deposit_then_refused_deposit"
scope = "sample"
why = "A code deposit's loan from withheld gas ends with its creation's frame. A creation whose state spill ran out of gas never reaches admission, so its loan would otherwise be handed back to a later creation whose data-size draw is refused (a creator's gas_left of 2,542,160 against the reference's 403,211)."

[[control]]
switch = "deposit_oof"
gate = "main"
scenario = "fz087"
scope = "sample"
why = "A deposit whose first frame cannot fund its value (OutOfFunds) is a failed deposit, as op-revm makes it; off, evm2's revert-class stop leaves it a normal reverted deposit."

[[control]]
switch = "deposit_site"
gate = "main"
scenario = "q03_det_create_ctor_write_salt8"
scope = "sample"
why = "A code deposit's state spill draws the frame's withheld gas first, through the fork's gas reserve (ReserveDraw::StateSpill(CodeDepositState)), and so does the deposited code's history at admission; off, both are charged to the spendable gas only."

[[control]]
switch = "blockhash_underflow"
gate = "main"
scenario = "a25_blockhash_empty_stack_underflows"
scope = "sample"
why = "BLOCKHASH pops its operand before the Host answers, so in a frame whose access is off an empty stack halts on the underflow and refuses nothing; off, the refusal runs before the opcode's own stack check and the frame reverts."

[[control]]
switch = "refuse_at_load"
gate = "main"
scenario = "a22_call_beneficiary_memory_unpayable_halts"
scope = "sample"
why = "In a frame whose access is off, the block beneficiary's account is refused where evm2's instruction loads it (the fork's account-load hook), after every charge the instruction makes before that load (a call's memory expansion and value transfer, EXTCODECOPY's copy and memory expansion); off, it is refused before the instruction's body, so a call that halts on its memory expansion reverts instead."

[[control]]
switch = "refusal_gas"
gate = "main"
scenario = "a19_extcodecopy_beneficiary_refused_on_static_gas"
scope = "sample"
why = "A refused load reverts the frame on the gas it had after the instruction's static gas, none of the dynamic gas charged before the load being owed; off, on the gas left at the load, so an EXTCODECOPY refused after its copy and memory charges uses more gas."

[[control]]
switch = "delegate_refusal"
gate = "main"
scenario = "t05_call_follows_delegation_refused"
scope = "sample"
why = "In a frame with volatile access off, a call of an account whose EIP-7702 delegate is the beneficiary is refused at the delegate's load (after the target's load and the delegation guard); off, it proceeds."

[[control]]
switch = "selfbalance_stack_order"
gate = "main"
scenario = "u2_full_stack_selfbalance_refused"
scope = "sample"
why = "SELFBALANCE of the beneficiary's own account in a frame whose access is off is refused before the push's stack check, as revm loads before it pushes; off, a full stack halts with a stack overflow instead of the refusal."

[[control]]
switch = "forward"
gate = "main"
scenario = "i9_limit_call_detained"
scope = "sample"
why = "A CALL's or CREATE's forward is computed from spendable plus withheld gas and draws the withheld gas first, through the fork's gas reserve (BudgetUse::Forward, ReserveDraw::Forward; keyless deployment included), as Satin computes it; off, from spendable gas only."

[[control]]
switch = "gas_total"
gate = "main"
scenario = "d3_gas_reads_full_gas"
scope = "sample"
why = "The GAS opcode reports spendable plus withheld gas, through the fork's gas reserve (BudgetUse::Gas); off, only the spendable part."

[[control]]
switch = "hand_back"
gate = "fuzz"
mode = 4
seed = 1995
scope = "sample"
why = "A caller that cannot pay a frame's start records starts no frame: the forward is handed back and the halt recorded as one that made no debit (GasTracker::record_no_debit_halt), so its burn is exact; off, the forward is lost."

[[control]]
switch = "hold"
gate = "main"
scenario = "d1_top_frame_crosses"
scope = "sample"
why = "After a volatile read the remaining gas above the detention cap is withheld from the frame; off, the cap is never applied."

[[control]]
switch = "hold_caller"
gate = "main"
scenario = "h11_hold_caller_limit_490"
scope = "sample"
why = "A caller resuming from a failed child that sent an Oracle hint is checked against the transaction's limits (the hint stays counted); off, it resumes unchecked."

[[control]]
switch = "hold_start"
gate = "main"
scenario = "fz010"
scope = "sample"
why = "A frame start is checked against the limits before it is counted (a transaction already over a limit is stopped there); off, the start is drawn first."

[[control]]
switch = "keyless"
gate = "main"
scenario = "k01_ok"
scope = "sample"
why = "The engine executes keyless deployment calls (system contract 0x6342...0003) itself; off, the call runs the contract's bytecode."

[[control]]
switch = "keyless_beneficiary"
gate = "main"
scenario = "k25b_signer_is_beneficiary_tight"
scope = "sample"
why = "A keyless deployment whose signer is the block beneficiary is a volatile read that detains the frame; off, it is not."

[[control]]
switch = "keyless_empty_deposit"
gate = "main"
scenario = "k04_empty_code"
scope = "sample"
why = "A keyless deployment that deposits empty code is refused, as Satin refuses it; off, it succeeds."

[[control]]
switch = "keyless_signer_growth"
gate = "main"
scenario = "k01_ok"
scope = "sample"
why = "A keyless deployment that creates its signer's account counts it on state growth; off, it is not counted."

[[control]]
switch = "keyless_takeback"
gate = "main"
scenario = "k16_signer_nonce_one_taken_back"
scope = "sample"
why = "After a keyless deployment, the creation's nonce bump of a signer that already had a nonce is taken back (and its write record refunded when nothing else changed), as Satin settles it; off, the bump stays."

[[control]]
switch = "lend"
gate = "main"
scenario = "d3_gas_reads_full_gas"
scope = "sample"
why = "Every state charge that spills past the reservoir (SSTORE's set and the other state sites, through the fork's gas reserve) and every history charge draws the frame's withheld gas first; off, they are charged to the spendable gas only."

[[control]]
switch = "modexp_two_step"
gate = "fuzz"
mode = 3
seed = 775
scope = "full"
why = "ModExp's price is probed in two steps (its 500 minimum, then the rest), as evm2 charges it; off, only the minimum is seen. Full corpus only: no sample case prices a ModExp call this way."

[[control]]
switch = "new_account_lend"
gate = "main"
scenario = "q42_det_unfunded_value_new_account"
scope = "sample"
why = "A new account's state charge that spills past the reservoir (a value CALL's target, SELFDESTRUCT's beneficiary, a keyless signer) draws the frame's withheld gas first, through the fork's gas reserve (ReserveDraw::StateSpill(NewAccountState)); off, it is charged to the spendable gas only. q18_det_selfdestruct_to_new_beneficiary differs too."

[[control]]
switch = "no_debit_record"
gate = "fuzz"
mode = 4
seed = 533
scope = "sample"
why = "A frame's burn reads what it had before its halt from the fork's halt record (GasTracker::halt_remaining), which keeps a halt that made no debit (a skipped cold load, the SSTORE sentry, a refused delegation) readable on the inspected path, where remaining is zeroed; off, only failed charges are read and the engine's plain and inspected runs disagree. Fuzz 4:1788 (the delegation's halt) differs too."

[[control]]
switch = "oracle_hints"
gate = "main"
scenario = "h08_direct_hint"
scope = "sample"
why = "An Oracle sendHint call is counted on the transaction's data size and forwarded by the engine (or stopped at the limit); off, the hint is neither counted nor reported."

[[control]]
switch = "pre_frame_stop"
gate = "main"
scenario = "e10_list_skipped_kv"
scope = "sample"
why = "A transaction whose authorization list the KV or state-growth rule skipped stops its first frame with that limit; off, the frame runs."

[[control]]
switch = "precompile_catalog"
gate = "main"
scenario = "p_bls_g2_msm_two_detained"
scope = "sample"
why = "A precompile without a fixed price is priced by probing it, so detention can hold the call to its price; off, it has no price and is not held."

[[control]]
switch = "precompile_hold"
gate = "main"
scenario = "d9_precompile_price_crosses"
scope = "sample"
why = "A precompile call is held to the detention cap and the limits with its price before it runs; off, it runs unheld."

[[control]]
switch = "registry_read"
gate = "main"
scenario = "p6_add"
scope = "sample"
why = "Every transaction reads the SequencerRegistry's account and slot 0 (the live system address), so both engines read the same state; off, the read sets differ."

[[control]]
switch = "salt"
gate = "main"
scenario = "p6_salt_sstore_set_m8"
scope = "sample"
why = "State gas prices are multiplied by the SALT bucket multiplier of the account or slot (and read its bucket); off, every multiplier is 1. The case writes a fresh slot in a bucket of multiplier 8, so its gas differs, not only its reads."

[[control]]
switch = "salt_min_bucket"
gate = "main"
scenario = "edge_salt_capacity_zero_slot"
scope = "sample"
why = "A SALT bucket that reports a capacity below the minimum bucket fails the transaction with the lookup's error; off, the floor division prices every state charge in that bucket at zero and the transaction runs."

[[control]]
switch = "sd_absent_leaf"
gate = "main"
scenario = "edge_transfer_then_create_destroyed"
scope = "sample"
why = "A destroyed account created in the transaction gives back its leaf's state gas, unit of state growth and write record when the transaction found the address absent at its start (an account that existed empty is not absent), at the new-account price, whichever charge materialized it; off, only a leaf the creation itself charged comes back, so a leaf an earlier transfer materialized keeps 183,600 state gas and its growth."

[[control]]
switch = "sd_existing_record"
gate = "replay"
block = "d4:28399774"
scope = "full"
why = "SELFDESTRUCT of an account created in the transaction gives back the account's own write record only when it was absent at the transaction's start; off, always. Full corpus only: the one recorded case is not in the sample."

[[control]]
switch = "sd_records"
gate = "main"
scenario = "fz040"
scope = "sample"
why = "SELFDESTRUCT's own write records are rebuilt from what it moved (each account's change since before the opcode); off, they are counted from the move alone."

[[control]]
switch = "sload_copy"
gate = "main"
scenario = "p7_sload_skip_cold_sees_total_read"
scope = "sample"
why = "A storage load's skip-cold check (SLOAD, SSTORE, and the Oracle's SLOAD in the engine) sees spendable plus withheld gas, through the fork's gas reserve (BudgetUse::ColdStorage); off, spendable gas only, so a cold load is skipped where Satin makes it. q56_det_oracle_read_crosses (the Oracle's read) differs too."

[[control]]
switch = "sstore_sentry"
gate = "main"
scenario = "p7_sstore_sentry_sees_total_read"
scope = "sample"
why = "SSTORE's EIP-2200 stipend sentry sees spendable plus withheld gas, through the fork's gas reserve (BudgetUse::SstoreSentry); off, spendable gas only, so a store Satin makes halts on the sentry."

[[control]]
switch = "system_missing_chain_id"
gate = "main"
scenario = "edge_system_legacy_oracle_without_chain_id"
scope = "sample"
why = "A system-address transaction without a chain id is refused for the missing chain id, as the reference refuses it; off, it is refused as carrying the wrong chain id."

[[control]]
switch = "system_nonce"
gate = "block"
block = "d4:3224158"
scope = "sample"
why = "A system-address transaction's nonce and EIP-3607 are checked (the deposit path it runs on checks neither); off, a stale system transaction runs instead of being refused."

[[control]]
switch = "system_sender_code"
gate = "main"
scenario = "edge_system_sender_delegated"
scope = "sample"
why = "A system-address transaction's sender passes EIP-3607 when its code is an EIP-7702 delegation, and the code is checked before the nonce; off, any code refuses the sender and the nonce is checked first, so a delegated live system address is refused where the reference promotes and runs its transaction."

[[control]]
switch = "system_shape"
gate = "main"
scenario = "edge_system_legacy_off_whitelist"
scope = "sample"
why = "Every envelope from the live system address other than a legacy call to a whitelisted contract is refused (a deposit from it is a failed deposit); off, a call off the whitelist from it runs as an ordinary transaction."

[[control]]
switch = "system_tx"
gate = "replay"
block = "p9:26400004"
scope = "sample"
why = "A legacy transaction from the live system address to the Oracle runs as a system transaction (exempt, fee-free, through the deposit path); off, it is an ordinary transaction. The block's ten system transactions have gas price 0 and gas limits near the block's 10,000,000,000, so off they are refused (fee cap below the base fee) where the reference runs them."

[[control]]
switch = "top_precompile_hold"
gate = "main"
scenario = "edge_top_ripemd160_sender_is_beneficiary"
scope = "sample"
why = "The transaction's own call of a precompile is priced and held under detention as a child call is (detained from the start when the sender or recipient is the block beneficiary): past the allowance and within the forward it is the compute stop; off, the precompile runs and the transaction succeeds."

[[control]]
switch = "tx_beneficiary"
gate = "main"
scenario = "t01_recipient_is_beneficiary"
scope = "sample"
why = "A transaction whose sender or recipient is the block beneficiary (or whose recipient delegates to it) is detained from its start; off, it runs undetained."

[[control]]
switch = "unclamped_draw"
gate = "fuzz"
mode = 2
seed = 1392
scope = "full"
why = "A frame's own resource draws see its budget minus its net use, unclamped, so a restore gives room back; off, the room is clamped to the budget. Full corpus only: no sample case draws on room a restore gave back."

[[control]]
switch = "wide_limits"
gate = "main"
scenario = "edge_growth_limit_u64_max"
scope = "sample"
why = "Usage is compared with each per-transaction limit over the whole u64 range of the limit; off, a limit at or above 2^63 narrows to a negative signed value and a transaction under it is stopped at once."

[[control]]
switch = "body_after_env"
gate = "main"
scenario = "edge_gas_above_block_body_over_limit"
scope = "sample"
why = "A user transaction's body is checked against its data-size limit after the environment's rules (the gas limit against the block's), as Satin does; off, a transaction whose gas limit is above the block's and whose body is over the limit is refused for its body instead."

[[control]]
switch = "body_refused_start"
gate = "main"
scenario = "edge_deposit_body_over_limit"
scope = "sample"
why = "A deposit refused for its body runs nothing: its first frame's start is not predicted (no read of its recipient) and no start settles; off, its recipient is read and an empty start settles on the ledger."

[[control]]
switch = "deposit_caller_code"
gate = "main"
scenario = "edge_deposit_delegated_sender"
scope = "sample"
why = "A deposit's caller is loaded with its code, as op-revm loads it; off, the code of a caller with a delegation or code is not read."

[[control]]
switch = "destroyed_start_charge"
gate = "main"
scenario = "edge_transfer_after_create_destroyed"
scope = "sample"
why = "An account the transaction created and destroyed counts nothing more, so a value sent to it or a creation onto it prices no write record at its start; off, the start charges a record nothing gives back (history gas and bytes rise)."

[[control]]
switch = "exempt_caller_budget"
gate = "main"
scenario = "edge_system_legacy_oracle_absent_sender"
scope = "sample"
why = "The account a promoted system-address transaction creates for its caller is counted outside the frames and not taken from the frame's unlimited budgets; off, the frame's state-growth budget is one less on the start ledger."

[[control]]
switch = "floor_before_history"
gate = "main"
scenario = "edge_gas_below_floor"
scope = "sample"
why = "A gas limit that covers the intrinsic gas without the body's history but not the calldata floor is refused for the floor, Satin's order of the gas checks; off, it is refused for the intrinsic gas with the history."

[[control]]
switch = "refused_deposit_caller"
gate = "main"
scenario = "edge_system_deposit_absent_sender"
scope = "sample"
why = "A deposit from the live system address is a failed deposit whose nonce bump creates an absent caller: a unit of state growth; off, no growth is counted."

[[control]]
switch = "resume_before_stop"
gate = "main"
scenario = "edge_creator_stopped_on_resume_detained"
scope = "sample"
why = "A frame stopped by a limit as it resumes from its child (its nonce record after a creation, or held again by hold_caller) resumes on the detention ledger first, as Satin counts the limit once the child merged into it; off, the frame stops unresumed and the detention stops its caller as soon as it resumes (gas and reads differ)."

[[control]]
switch = "tx_spill_unwind"
gate = "main"
scenario = "edge_value_returned_to_sender"
scope = "sample"
why = "The first frame's start record is charged on the transaction's gas with its spill recorded there, so a reservoir the first frame returns (the record taken back when the value comes back to the sender, or with the leaf of a creation its constructor destroyed) unwinds that spill into the regular gas, as Satin's child-merge return does for every spill outstanding at the transaction. Off, the spill is not recorded and the reservoir keeps the gas (reservoir_remaining differs)."

# The gate harness's fixture switches (`next/diff`); the engine's controls continue after them.

[[harness]]
switch = "absent_storage_read"
gate = "main"
scenario = "e11b_list_fits_growth"
scope = "sample"
why = "The harness has evm2 read the storage of an account its database lacks, as revm does for the reference, so both engines record the same reads; off, the read is skipped and only the reads differ (the value read is zero either way)."

[[harness]]
switch = "empty_fixture_account"
gate = "fuzz"
mode = 4
seed = 159
scope = "sample"
why = "The harness leaves out a fixture account with no balance, code, nonce or storage, as the reference's database builder does, so the account is absent on both sides; off, it exists as an empty account, so the transaction no longer creates it (its state growth and state gas differ)."

[[harness]]
switch = "fixture_delegation"
gate = "main"
scenario = "t03_recipient_delegates_to_beneficiary"
scope = "sample"
why = "The harness loads 23-byte fixture code `0xef0100 || address` as an EIP-7702 delegation, as the reference's database reads it; off, it is plain bytecode and a call to the account no longer follows the delegation."

[[control]]
switch = "start_at_runtime"
gate = "main"
scenario = "edge_start_record_unpaid_legacy"
scope = "sample"
why = "The first frame's start record is charged after validation, which holds the gas limit to the intrinsic gas and the body's history: a gas limit short of the record is an included out-of-gas that runs no frame (fees and nonce paid). Off, the record is part of the intrinsic gas and the transaction is refused."

[[control]]
switch = "start_reads_no_target"
gate = "main"
scenario = "edge_start_record_unpaid_absent_recipient"
scope = "sample"
why = "The start's record is decided without loading its target (an account the transaction has not loaded is unchanged), and the target is read only right before the first frame is built: a transaction that cannot pay the record reads nothing of its recipient. Off, the prediction loads the recipient before validation."

[[control]]
switch = "deposit_start_after_caller"
gate = "main"
scenario = "edge_deposit_new_caller_unpaid_absent_recipient"
scope = "sample"
why = "A deposit's first-frame start is parked once the deposit passed its intrinsic check and paid its created caller: one that cannot pay the caller reads nothing of its recipient. Off, the start is predicted while the deposit is prepared, reading the recipient."

[[control]]
switch = "prepared_deposit_no_start"
gate = "main"
scenario = "edge_deposit_below_intrinsic"
scope = "sample"
why = "A deposit refused by its intrinsic gas check made no start, so it settles none. Off, the comparison reports a depth-0 settlement with unlimited budgets for it."

[[control]]
switch = "sd_read_after_write"
gate = "main"
scenario = "edge_sd_beneficiary_history_unpaid"
scope = "sample"
why = "SELFDESTRUCT commits its reads of the block beneficiary only after its records were held to the limits and their history paid: a destruction that then fails detains nothing. Off, the read is committed first, and the caller is held to the detention limit."

[[control]]
switch = "keyless_value_hold"
gate = "main"
scenario = "edge_keyless_value_detained_sender"
scope = "sample"
why = "A keyless call with a value decides its 100,000 overhead under detention: when the overhead crosses the compute limit, the call stops there with none of it billed, before its value is refused. Off, the overhead is charged and the value refused."

[[control]]
switch = "failed_deposit_checked_mint"
gate = "main"
scenario = "edge_deposit_failed_mint_overflow"
scope = "sample"
why = "A failed deposit credits its mint with a checked add, as op-revm does: a balance that cannot hold it stays as it was. Off, the credit wraps and the sender is left with a small balance."

[[control]]
switch = "keyless_sender_record"
gate = "main"
scenario = "edge_keyless_signer_is_sender_ok"
scope = "sample"
why = "A keyless deployment whose signer is the transaction's sender charges no record of the signer's nonce (the sender's account is never recorded again), so setting the nonce back gives none back. Off, the take-back gives back 3,520 gas of history that was never charged (gas used and the history differ)."

[[control]]
switch = "first_frame_hold"
gate = "main"
scenario = "edge_first_frame_over_growth_value_to_eoa"
scope = "sample"
why = "The first frame's start is drawn and held in one step, built or answered with a success, dimension by dimension (data size, KV updates, state growth), each also when the start adds nothing to it: a deposit whose created caller is already over a state-growth limit of 0 is stopped there. Off, an answered first frame is not held (the value moves and the call succeeds) and a built one is held before its start is drawn (the stop names the wrong dimension)."

[[control]]
switch = "deposit_code_after_intrinsic"
gate = "main"
scenario = "edge_sweep_dep_delegated_existing_value_intrinsic"
scope = "sample"
why = "A deposit reads its sender's code only once it passed its intrinsic and floor checks: a delegated sender's deposit that fails its intrinsic gas reads no code. Off, the code is read before the check (the read set differs)."

[[control]]
switch = "deposit_creation_nonce_max"
gate = "main"
scenario = "edge_deposit_create_nonce_max"
scope = "sample"
why = "A deposit creating from a sender at nonce u64::MAX, whose nonce cannot be bumped, is answered as revm answers it: a success, nothing created, the frame's gas untouched and the created account's state gas not kept (a start the caller's account refuses counts nothing). Off, the creation runs and deploys at the sender's u64::MAX address (gas, state and the counts differ)."
