[package]
name = "op-evm2"
description = "Vendored Optimism execution layer for the Satin engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The upstream workspace's lints (foundry-rs/evm2-networks), so the vendored code is held to them.
[lints.clippy]
dbg_macro = "warn"
manual_string_new = "warn"
uninlined_format_args = "warn"
use_self = "warn"
redundant_clone = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[dependencies]
evm2.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
thiserror.workspace = true

[dev-dependencies]
op-revm = { workspace = true, features = ["std", "optional_balance_check", "optional_fee_charge"] }
revm = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = ["evm2/std", "alloy-consensus/std", "alloy-eips/std", "alloy-primitives/std", "thiserror/std"]
